    <title>Gerenciador de Revisões</title>
    <script>
      // Para evitar FOUC (flash of unstyled content), este script é executado antes do resto da página.
      // Define 'dark' se estiver salvo, caso contrário, remove para usar o padrão claro.
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
