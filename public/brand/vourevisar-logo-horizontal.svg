<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" role="img" aria-labelledby="title desc">
  <title id="title">vouRevisar</title>
  <desc id="desc">Logo horizontal do vouRevisar com símbolo de progresso e revisão.</desc>
  <defs>
    <linearGradient id="vr-mark-gradient" x1="24" y1="132" x2="170" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2F80FF"/>
      <stop offset="0.54" stop-color="#28B8D8"/>
      <stop offset="1" stop-color="#5E9F3E"/>
    </linearGradient>
    <filter id="vr-soft-shadow" x="-20%" y="-30%" width="140%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <g transform="translate(28 22)" filter="url(#vr-soft-shadow)">
    <rect x="0" y="0" width="136" height="136" rx="32" fill="#FFFFFF"/>
    <path d="M31 102H105" fill="none" stroke="#2F80FF" stroke-width="13" stroke-linecap="round"/>
    <path d="M32 87L61 52L84 79L107 38" fill="none" stroke="url(#vr-mark-gradient)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="61" cy="52" r="7.5" fill="#FFFFFF" stroke="#28B8D8" stroke-width="5"/>
    <circle cx="84" cy="79" r="7.5" fill="#FFFFFF" stroke="#5E9F3E" stroke-width="5"/>
  </g>

  <g transform="translate(188 51)">
    <text x="0" y="64" fill="#172033" font-family="Inter, Manrope, Avenir Next, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="0">
      <tspan font-weight="500">vou</tspan><tspan fill="#2F80FF" font-weight="800">Revisar</tspan>
    </text>
    <text x="5" y="95" fill="#617084" font-family="Inter, Manrope, Avenir Next, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="2.6">
      REVISÃO INTELIGENTE PARA CONCURSOS
    </text>
  </g>
