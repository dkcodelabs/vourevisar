<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
            <defs>
                <linearGradient id="neonGradientGraph" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#ff7b00" />
                    <stop offset="50%" stop-color="#ffea00" />
                    <stop offset="100%" stop-color="#00ff87" />
                </linearGradient>

                <filter id="neonGlow" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1200" height="1000">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur1" />
                    <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur2" />
                    <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur3" />
                    <feMerge>
                        <feMergeNode in="blur3" />
                        <feMergeNode in="blur2" />
                        <feMergeNode in="blur1" />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>
            </defs>

            <!-- Linhas estáticas -->
            <path d="M 580 345 L 220 345.01" stroke="#00d2ff" stroke-width="12" stroke-linecap="round" fill="none" filter="url(#neonGlow)" />
            <path d="M 220 320 L 330 180 L 440 300 L 580 140" stroke="url(#neonGradientGraph)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#neonGlow)" />

            <!-- Texto estático -->
            <g>
                <text x="400" y="420" font-size="64" fill="#ffffff" text-anchor="middle" letter-spacing="-1.5">
                    <tspan font-weight="400">vou</tspan><tspan font-weight="700">Revisar</tspan>
                </text>
            </g>
        </svg>