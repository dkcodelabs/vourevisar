<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Focus Mode - Study Timer</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Outfit:wght@200;300;400;500;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#3b82f6",
                        "accent": "#22d3ee",
                        "background-dark": "#030712",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                        "timer": ["Outfit", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style type="text/tailwindcss">
        .glass-bg {
            background: radial-gradient(circle at 50% 50%, rgba(30, 58, 138, 0.4) 0%, rgba(3, 7, 18, 0.95) 100%);
            backdrop-filter: blur(60px) saturate(150%);
            -webkit-backdrop-filter: blur(60px) saturate(150%);
        }
        .grain-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.05;
            background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuAfBsSekLKMbksYhEK0G1JxaAO3ANYbIEnBke5YMInA5DCCBonbF-Go4GGvG-CibZuUGraYkMNG3Rw6dfT6O7MoqqPINfDWtKJN2fQGyJ6usDK2LtH-qmpq2jtii6nSnFycvu5RoX8UdmaBvjOH5Rg8RmleDhmREK-AtzIeMOB1k5uOoAz-ZzXKQ-rePk5exdwB_RnonJeuy3YupswETt0GG3XusD9qQYbDllb0vJQ_wUtJL_GBlIV2VUE2yvw9GvzLrYLgwvzFbz6h);
        }
        .timer-glow {
            text-shadow: 0 0 50px rgba(59, 130, 246, 0.5), 0 0 20px rgba(34, 211, 238, 0.3);
        }
        .ambient-light-1 {
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 70%);
        }
        .ambient-light-2 {
            background: radial-gradient(circle, rgba(34, 211, 238, 0.1) 0%, transparent 70%);
        }
    </style>
</head>

<body class="bg-background-dark font-display text-slate-100 antialiased overflow-hidden h-screen">
    <div class="grain-overlay"></div>
    <div class="fixed inset-0 bg-[#020617] -z-10"></div>
    <div
        class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[80vw] h-[80vh] ambient-light-1 blur-[120px] pointer-events-none z-0">
    </div>
    <div class="absolute top-[20%] right-[10%] w-[40vw] h-[40vh] ambient-light-2 blur-[100px] pointer-events-none z-0">
    </div>
    <div class="relative flex h-screen w-full flex-col glass-bg overflow-hidden z-10 border border-white/5">
        <header class="flex items-center justify-between w-full px-10 py-8 z-20">
            <div class="flex items-center gap-4 opacity-60 hover:opacity-100 transition-opacity">
                <div class="flex items-center justify-center size-9 rounded-full bg-white/5 border border-white/10">
                    <span class="material-symbols-outlined text-primary text-[20px]">lens_blur</span>
                </div>
                <h2 class="text-xs font-medium uppercase tracking-[0.3em] text-white/80">Focus Aura</h2>
            </div>
            <div class="flex items-center gap-3">
                <button
                    class="flex size-11 items-center justify-center rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-white/70 hover:text-white transition-all"
                    title="Picture in Picture">
                    <span class="material-symbols-outlined text-[20px]">picture_in_picture_alt</span>
                </button>
                <button
                    class="flex size-11 items-center justify-center rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-white/70 hover:text-white transition-all"
                    title="Toggle Fullscreen">
                    <span class="material-symbols-outlined text-[20px]">fullscreen</span>
                </button>
                <button
                    class="flex size-11 items-center justify-center rounded-xl bg-white/10 hover:bg-red-500/20 border border-white/10 text-white/70 hover:text-white transition-all ml-2"
                    title="Close Focus Mode">
                    <span class="material-symbols-outlined text-[20px]">close</span>
                </button>
            </div>
        </header>
        <main class="flex-1 flex flex-col items-center justify-center px-4 relative z-20">
            <div class="flex flex-col items-center text-center">
                <h1
                    class="text-white text-[100px] sm:text-[140px] md:text-[200px] font-timer font-extralight leading-none tracking-tight timer-glow select-none mb-4">
                    00:45:00
                </h1>
                <div class="space-y-1">
                    <p class="text-white/80 text-lg font-light tracking-wide">Matemática</p>
                    <p class="text-white/40 text-[10px] font-bold uppercase tracking-[0.4em]">Cálculo I</p>
                </div>
                <div class="w-48 mt-12 h-[1px] bg-white/10 relative">
                    <div class="absolute top-0 left-0 h-full bg-accent/60 shadow-[0_0_8px_rgba(34,211,238,0.5)]"
                        style="width: 45%;"></div>
                </div>
            </div>
        </main>
        <footer class="w-full pb-16 pt-8 flex flex-col items-center gap-10 z-20">
            <div class="flex flex-col sm:flex-row items-center gap-6">
                <div class="flex items-center gap-4">
                    <button
                        class="flex items-center gap-3 px-8 py-4 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/10 text-white/80 transition-all group">
                        <span
                            class="material-symbols-outlined text-[20px] group-hover:scale-110 transition-transform">pause</span>
                        <span class="text-sm font-medium tracking-wide">Pause</span>
                    </button>
                    <button
                        class="flex items-center gap-3 px-8 py-4 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/10 text-white/80 transition-all group">
                        <span
                            class="material-symbols-outlined text-[20px] group-hover:rotate-12 transition-transform">music_note</span>
                        <span class="text-sm font-medium tracking-wide">Lofi Music</span>
                    </button>
                </div>
                <button
                    class="flex items-center gap-3 px-10 py-4 rounded-2xl bg-white text-slate-950 font-semibold text-base shadow-xl hover:bg-slate-200 transition-all transform hover:scale-105 active:scale-95">
                    <span class="material-symbols-outlined text-[22px]">stop_circle</span>
                    Stop Session
                </button>
            </div>
            <div class="text-white/20 text-[10px] font-medium uppercase tracking-[0.3em]">
                ESC to exit • SPACE to pause
            </div>
        </footer>
        <div
            class="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,0.01)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.01)_1px,transparent_1px)] bg-[size:120px_120px] pointer-events-none">
        </div>
    </div>

</body>

</html>
