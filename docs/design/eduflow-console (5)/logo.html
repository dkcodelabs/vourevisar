<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animação vouRevisar - Versão Final</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #070a13;
            /* Fundo noturno premium */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        .logo-container {
            width: 100%;
            max-width: 800px;
            cursor: pointer;
            position: relative;
        }

        /* 1. Animação da Linha Azul */
        .base-line {
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: drawLine 1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* 2. Animação do Gráfico (Com correção severa para o Safari/iOS) */
        .graph-line {
            /* 105 garante que a ponta arredondada fique fora do caminho no início */
            stroke-dasharray: 105;
            stroke-dashoffset: 105;
            opacity: 0;
            /* Unificamos o tempo e o delay em uma única animação de 2.5s */
            animation: drawGraph 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* 3. Animação do Texto */
        .logo-text {
            opacity: 0;
            transform: translateY(15px);
            animation: fadeUpText 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            animation-delay: 2.5s;
            /* Entra assim que o gráfico termina */
        }

        @keyframes drawLine {
            0% {
                stroke-dashoffset: 100;
            }

            100% {
                stroke-dashoffset: 0;
            }
        }

        /* Esta estrutura de keyframes impede que qualquer ponto fantasma apareça */
        @keyframes drawGraph {

            0%,
            39.9% {
                stroke-dashoffset: 105;
                opacity: 0;
            }

            40% {
                /* Momento exato que a linha azul termina (1s de 2.5s) */
                stroke-dashoffset: 105;
                opacity: 1;
            }

            100% {
                stroke-dashoffset: 0;
                opacity: 1;
            }
        }

        @keyframes fadeUpText {
            0% {
                opacity: 0;
                transform: translateY(15px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="logo-container" id="logoContainer" title="Clique para reiniciar a animação">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
            <defs>
                <!-- GRADIENTE: Laranja -> Verde -->
                <linearGradient id="neonGradientGraph" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#ff7b00" /> <!-- Laranja Neon -->
                    <stop offset="50%" stop-color="#ffea00" /> <!-- Transição Amarela -->
                    <stop offset="100%" stop-color="#00ff87" /> <!-- Verde Brilhante -->
                </linearGradient>

                <!-- Efeito Neon -->
                <filter id="neonGlow" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1200" height="1000">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur1" />
                    <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur2" />
                    <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur3" />
                    <feMerge>
                        <feMergeNode in="blur3" />
                        <feMergeNode in="blur2" />
                        <feMergeNode in="blur1" />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>
            </defs>

            <!-- Linha Horizontal (Azul Neon) com espessura 12 -->
            <path class="base-line" d="M 580 345 L 220 345.01" stroke="#00d2ff" stroke-width="12" stroke-linecap="round"
                fill="none" pathLength="100" filter="url(#neonGlow)" />

            <!-- Linha do Gráfico com espessura 12 e coordenadas ajustadas -->
            <path class="graph-line" d="M 220 320 L 330 180 L 440 300 L 580 140" stroke="url(#neonGradientGraph)"
                stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" pathLength="100"
                filter="url(#neonGlow)" />

            <!-- Texto da Marca ajustado (y="420") para manter a distância padrão -->
            <g class="logo-text">
                <text x="400" y="420" font-size="64" fill="#ffffff" text-anchor="middle" letter-spacing="-1.5">
                    <tspan font-weight="400">vou</tspan>
                    <tspan font-weight="700">Revisar</tspan>
                </text>
            </g>
        </svg>
    </div>

    <!-- Script de replay -->
    <script>
        const container = document.getElementById('logoContainer');
        container.addEventListener('click', () => {
            const baseLine = document.querySelector('.base-line');
            const graphLine = document.querySelector('.graph-line');
            const logoText = document.querySelector('.logo-text');

            baseLine.style.animation = 'none';
            graphLine.style.animation = 'none';
            logoText.style.animation = 'none';

            void baseLine.offsetWidth;

            baseLine.style.animation = null;
            graphLine.style.animation = null;
            logoText.style.animation = null;
        });
    </script>
</body>

</html>
