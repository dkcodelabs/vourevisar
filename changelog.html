    .view-btn {
      padding: 6px 14px;

      font-size: 0.8rem;
      font-weight: 600;

      border: none;

    .view-btn.active {

      align-items: center;
      gap: 0.6rem;

    .filter-btn:hover {

      border-color: var(--border-hover);

    .filter-btn.active {

      border-color: var(--accent);

      text-align: center;

    .no-data { text-align: center; padding: 6rem; color: var(--text-muted); font-size: 1.1rem; }

    .back-to-top {
      position: fixed;

      right: 2.5rem;

      height: 48px;

**IA:** Antigravity (Gemini)

  <script>
    let entries = [];
    let currentFilter = 'all';
    let searchQuery = '';

    let timelineEl, searchInput, filterBtns, btnTimeline, btnCompact;

    function initElements() {
      timelineEl = document.getElementById('timeline');
      searchInput = document.getElementById('search');
      filterBtns = document.querySelectorAll('.filter-btn');
      btnTimeline = document.getElementById('btnTimeline');
      btnCompact = document.getElementById('btnCompact');
    }

    async function loadLocalData() {
      try {
        console.log("Tentando carregar CHANGELOG.md externo...");
        let md = "";
        
        try {
          const response = await fetch('/CHANGELOG.md');
          if (response.ok) {
            md = await response.text();
            console.log("Dados carregados do arquivo externo (CHANGELOG.md)");
          } else {
            throw new Error(`Arquivo não encontrado: ${response.status}`);
          }
        } catch (fetchErr) {
          console.warn("Falha ao buscar arquivo externo, usando fallback local:", fetchErr.message);
          const dataEl = document.getElementById('changelog-data');
          if (!dataEl) {
            console.error("Elemento #changelog-data não encontrado e fetch falhou.");
            return;
          }
          md = dataEl.textContent;
          console.log("Dados carregados do fallback interno (#changelog-data)");
        }

        if (md) {
          parseMarkdown(md);
          render();
          updateCounts();
        }
      } catch (err) {
        console.error("Erro fatal no loadLocalData:", err);
      }
    }

    function parseMarkdown(md) {
      console.log("Iniciando parsing do Markdown robusto...");
      // Normaliza quebras de linha e limpa espaços iniciais/finais
      const cleanMd = md.replace(/\r\n/g, '\n').trim();
      
      // Split pelo delimitador ## 
      // Adicionamos \n no início para capturar a primeira seção se necessário
      const rawSections = ('\n' + cleanMd).split('\n## ');
      entries = []; 
      
      console.log("Seções brutas encontradas:", rawSections.length);

      rawSections.forEach((sec, idx) => {
        if (!sec.trim()) return;
        
        const lines = sec.split('\n');
        const titleLine = lines[0].trim();
        
        // Pula seções administrativas ou vazias
        if (idx === 0 || titleLine.toLowerCase().includes('índice') || !titleLine) return;
        
        const parts = titleLine.split(' — ');
        const dateParts = (parts[0] || '').trim().split(' ');
        
        const entry = {
          date: dateParts[0] || '?',
          time: dateParts[1] || '08:00',
          title: (parts[1] || parts[0] || 'Update').trim(),
          contentRaw: '',
          meta: { ia: 'Antigravity', type: [] }
        };

        let contentLines = [];
        for (let i = 1; i < lines.length; i++) {
          const rawLine = lines[i];
          const line = rawLine.trim();
          
          if (!line) {
            contentLines.push(rawLine);
            continue;
          }

          if (line.toLowerCase().startsWith('**ia:**')) {
            entry.meta.ia = line.split(':')[1]?.trim() || 'Antigravity';
            continue;
          }
          if (line.toLowerCase().startsWith('**tipo:**')) {
             const typesRaw = line.toLowerCase();
             if (typesRaw.includes('correção') || typesRaw.includes('fix') || typesRaw.includes('bug') || typesRaw.includes('correcao')) entry.meta.type.push('bug');
             if (typesRaw.includes('feature') || typesRaw.includes('✨') || typesRaw.includes('novidade')) entry.meta.type.push('feature');
             if (typesRaw.includes('otimização') || typesRaw.includes('otimizacao') || typesRaw.includes('🔧')) entry.meta.type.push('opt');
             if (typesRaw.includes('doc') || typesRaw.includes('📝')) entry.meta.type.push('docs');
             continue;
          }
          if (line.toLowerCase().startsWith('**status:**')) continue;

          contentLines.push(rawLine);
        }

        entry.contentRaw = contentLines.join('\n').trim();
        if (entry.title) entries.push(entry);
      });
      
      console.log("Entries processadas com sucesso:", entries.length);
    }

    function safeMarked(content) {
      try {
        if (!window.marked) return content;
        // Tenta parse, lidando com possíveis retornos estranhos
        const result = marked.parse(content);
        return (typeof result === 'string') ? result : content;
      } catch (e) {
        console.error("Erro no marked.parse:", e);
        return content;
      }
    }

    function render() {
      if (!timelineEl) return;
      
      const filtered = entries.filter(e => {
        const matchF = currentFilter === 'all' || e.meta.type.includes(currentFilter);
        const matchS = (e.title + ' ' + e.contentRaw).toLowerCase().includes(searchQuery.toLowerCase());
        return matchF && matchS;
      });

      if (!filtered.length) { 
        timelineEl.innerHTML = '<div class="no-data">Nenhum registro corresponde aos filtros selecionados.</div>'; 
        return; 
      }

      timelineEl.innerHTML = filtered.map(e => `
        <div class="entry" onclick="goToEntry(this)">
          <div class="entry-date">
            <span class="${entries[0] && e.date === entries[0].date ? 'status-active' : ''}" style="position:relative">${e.date}</span>
            <span class="time">${e.time}</span>
          </div>
          <div class="entry-card">
            <div class="entry-header">
              <h2 class="entry-title">${highlight(e.title, searchQuery)}</h2>
              <div class="compact-meta">
                <div class="metadata-row">
                  <span class="tag tag-ia">IA: ${e.meta.ia}</span>
                  ${[...new Set(e.meta.type)].map(t => `<span class="tag tag-${t}">${{bug:'Correção',feature:'Novidade',opt:'Otimização',docs:'Docs'}[t]}</span>`).join('')}
                </div>
              </div>
            </div>
            <div class="prose">${highlight(safeMarked(e.contentRaw), searchQuery)}</div>
          </div>
        </div>
      `).join('');

      // Formatar alerts e hints
      document.querySelectorAll('blockquote').forEach(b => {
        const html = b.innerHTML.toLowerCase();
        if (html.includes('[!important]')) b.style.borderColor = 'var(--bug)';
        if (html.includes('[!tip]')) b.style.borderColor = 'var(--accent)';
        b.innerHTML = b.innerHTML.replace(/\[!(IMPORTANT|NOTE|WARNING|TIP|CAUTION)\]/gi, '<strong>$1</strong>');
      });
    }

    function highlight(text, q) {
      if (!q || q.length < 2) return text;
      const r = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
      return text.replace(r, '<mark>$1</mark>');
    }

    function goToEntry(el) {
      if (document.body.classList.contains('view-compact')) {
        btnTimeline.click();
        setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'center' }), 100);
      }
    }

    function updateCounts() {
      document.getElementById('totalCount').textContent = entries.length;
      ['bug', 'feature', 'opt', 'docs'].forEach(t => {
        const count = entries.filter(e => e.meta.type.includes(t)).length;
        const el = document.getElementById(`${t}Count`);
        if (el) el.textContent = count;
      });
    }
  </script>

  <div class="content-area">
    <div class="container">
      <div class="timeline" id="timeline"></div>
    </div>
  </div>

  <button class="back-to-top" id="backToTop">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 15l-6-6-6 6"/></svg>
  </button>

  <script>
    // Re-bind the Start logic to ensure DOM is ready
    window.addEventListener('DOMContentLoaded', async () => {
      initElements();
      
      if (searchInput) {
        searchInput.addEventListener('input', e => { searchQuery = e.target.value; render(); });
      }

      if (filterBtns && filterBtns.length) {
        filterBtns.forEach(b => b.addEventListener('click', () => {
          filterBtns.forEach(x => x.classList.remove('active'));
          b.classList.add('active'); 
          currentFilter = b.dataset.filter; 
          render();
        }));
      }

      if (btnTimeline) {
        btnTimeline.addEventListener('click', () => {
          document.body.classList.remove('view-compact');
          btnTimeline.classList.add('active'); 
          btnCompact.classList.remove('active');
          render();
        });
      }

      if (btnCompact) {
        btnCompact.addEventListener('click', () => {
          document.body.classList.add('view-compact');
          btnCompact.classList.add('active'); 
          btnTimeline.classList.remove('active');
          render();
        });
      }

      const btt = document.getElementById('backToTop');
      if (btt) {
        window.addEventListener('scroll', () => {
          if (window.scrollY > 400) btt.classList.add('visible');
          else btt.classList.remove('visible');
        });
        btt.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
      }

      await loadLocalData();
    });
  </script>
</body>
</html>
