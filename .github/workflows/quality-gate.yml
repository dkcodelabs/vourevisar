name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        # React Router 6 has two documented moderate findings whose only
        # automated fix is a breaking Router 7 migration. Keep the launch
        # gate strict for exploitable high/critical issues; the moderate
        # migration remains tracked separately instead of using audit fix
        # during a financial-flow release.
        run: npm audit --omit=dev --audit-level=high

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test:run

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build
