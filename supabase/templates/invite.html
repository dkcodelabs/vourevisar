<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convite</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f8fafc;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #0ea5e9, #06b6d4);
      padding: 30px;
      text-align: center;
    }
    .header h1 {
      color: white;
      margin: 0;
      font-size: 24px;
    }
    .content {
      padding: 40px 30px;
    }
    .content h2 {
      color: #1e293b;
      margin-top: 0;
      margin-bottom: 20px;
    }
    .content p {
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .button {
      display: inline-block;
      background: linear-gradient(135deg, #0ea5e9, #06b6d4);
      color: white;
      text-decoration: none;
      padding: 15px 30px;
      border-radius: 8px;
      font-weight: 600;
      margin: 20px 0;
    }
    .footer {
      background: #f1f5f9;
      padding: 20px 30px;
      text-align: center;
      font-size: 14px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>vouRevisar</h1>
    </div>
    <div class="content">
      <h2>Você foi convidado!</h2>
      <p>Olá!</p>
      <p>Você foi convidado para se juntar ao vouRevisar. Clique no botão abaixo para aceitar o convite:</p>
      
      <a href="{{ .ConfirmationURL }}" class="button">Aceitar Convite</a>
      
      <p>Este link expira em 24 horas.</p>
    </div>
    <div class="footer">
      <p>© 2025 vouRevisar. Todos os direitos reservados.</p>
    </div>
  </div>
</body>
</html>
